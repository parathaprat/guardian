<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>guard[ai]n</title>
    <meta name="description" content="An AI dispatch agent for physical security operations. Watches the event stream, prioritizes, dispatches, and measurably gets smarter." />
    <link rel="preload" href="/fonts/metropolis-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/metropolis-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230D0D0D'/%3E%3Crect x='9' y='9' width='14' height='14' fill='%23EA5112'/%3E%3C/svg%3E" />
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('guardain.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        else document.documentElement.removeAttribute('data-theme');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
